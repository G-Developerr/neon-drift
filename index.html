    if (!on) { TILT.has = false; return; }
    var add = function () {
      if (TILT.bound) return;
      TILT.bound = true;
      window.addEventListener('deviceorientation', function (e) {
        if (e.beta === null) return;
        var ang = (screen.orientation && screen.orientation.angle !== undefined) ? screen.orientation.angle : (window.orientation || 0);
        var v;
        if (ang === 90) v = e.beta; else if (ang === -90 || ang === 270) v = -e.beta; else v = e.gamma;
        TILT.v = clamp(v / 22, -1, 1);

      });
    };
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function (r) { if (r === 'granted') add(); }).catch(function () { });
    } else add();
  }

  function readGamepad() {
    if (!navigator.getGamepads) return null;
    var pads = navigator.getGamepads();
    for (var i = 0; i < pads.length; i++) {
      var gp = pads[i];
      if (gp && gp.connected) return gp;
    }
    return null;
  }

  function readPlayerInput(c, dt) {
    var inp = c.in, st = SAVE.settings;
    var steer = (KEYS.right ? 1 : 0) - (KEYS.left ? 1 : 0);
    if (!steer && TOUCH.padOn) steer = TOUCH.steerA;
    if (st.tilt && TILT.has && usingTouch) {
      var tv = TILT.v;
      if (Math.abs(tv) < 0.06) tv = 0;
      steer = clamp(steer + tv * 1.2, -1, 1);
    }
    var thr = KEYS.up || TOUCH.gas ? 1 : 0;
    var brk = KEYS.down || TOUCH.brake ? 1 : 0;
    if (usingTouch && st.autoGas && !TOUCH.brake) thr = 1;
    var hb = KEYS.hb || TOUCH.drift;
    var nitro = KEYS.nitro || TOUCH.nitro;
    var gp = readGamepad();
    if (gp) {
      var ax = gp.axes[0] || 0;
      if (Math.abs(ax) > 0.12) steer = clamp(ax * 1.15, -1, 1);
      var bt = function (n) { var b = gp.buttons[n]; return b ? (b.value > 0.3 || b.pressed) : false; };
      if (bt(7) || bt(0)) thr = 1;
      if (bt(6)) brk = 1;
      if (bt(2) || bt(1)) hb = true;
      if (bt(5) || bt(3)) nitro = true;
      if (bt(9) && !G.padPause) { G.padPause = true; if (G.state === 'race') pauseGame(); else if (G.state === 'paused') resumeGame(); }
      if (!bt(9)) G.padPause = false;
    }
    // drift assist: gently counter-steers when the car is about to over-rotate
    if (st.assist && c.drifting && Math.abs(c.slip) > 0.5) {
      var over = (Math.abs(c.slip) - 0.5) * 2.2;
      steer = clamp(steer + sign(c.slip) * over, -1, 1);

    inp.steer = steer; inp.thr = thr; inp.brk = brk; inp.hb = !!hb; inp.nitro = !!nitro;
  }

  function replayApply(dt) {
    var R = G.R, rp = G.replay, rec = R.rec;
    while (rp.i < rec.length - 2 && rec[rp.i + 1].t <= rp.t) rp.i++;
    while (rp.i > 0 && rec[rp.i].t > rp.t) rp.i--;
    var A = rec[rp.i], B = rec[Math.min(rp.i + 1, rec.length - 1)];
    var f = clamp((rp.t - A.t) / Math.max(1e-6, B.t - A.t), 0, 1);
    for (var k = 0; k < R.cars.length; k++) {
      var c = R.cars[k], a = A.s[k], b = B.s[k];
      if (!a || !b) continue;
      setRemoteFlags(c, f < 0.5 ? a : b);
      c.x = lerp(a[0], b[0], f); c.y = lerp(a[1], b[1], f);
      c.a = a[2] + wrapAngle(b[2] - a[2]) * f;
      c.vx = lerp(a[3], b[3], f); c.vy = lerp(a[4], b[4], f);
    }

      rp.play = !rp.play; sfx('click'); replayButtons();
    });
    $('rpBack').addEventListener('click', function () { var rp = G.replay; if (!rp) return; rp.t = Math.max(G.R.rec[0].t, rp.t - 5); rp.i = 0; PARTS.length = 0; sfx('click'); });
    $('rpSpeed').addEventListener('click', function () { var rp = G.replay; if (!rp) return; rp.speed = rp.speed === 1 ? 2 : (rp.speed === 2 ? 0.5 : 1); sfx('click'); replayButtons(); });
    $('rpCam').addEventListener('click', function () {
      var rp = G.replay; if (!rp) return;
      rp.cam = (rp.cam + 1) % G.R.cars.length; sfx('click'); replayButtons();
      updateCamera(G.R.cars[rp.cam], 0, true);
    });
    $('rpPhoto').addEventListener('click', function () { if (!G.replay) return; G.photo = true; sfx('click'); $('replayBar').classList.add('hidden'); $('photoBar').classList.remove('hidden'); });
    $('rpClose').addEventListener('click', stopReplay);
    $('phSave').addEventListener('click', savePhoto);
    $('phIn').addEventListener('click', function () { if (G.replay) G.replay.zoomMul = Math.min(2.5, G.replay.zoomMul * 1.2); });
    $('phOut').addEventListener('click', function () { if (G.replay) G.replay.zoomMul = Math.max(0.4, G.replay.zoomMul / 1.2); });
    $('phCam').addEventListener('click', function () { $('rpCam').click(); });
    $('phClose').addEventListener('click', function () { G.photo = false; $('photoBar').classList.add('hidden'); $('replayBar').classList.remove('hidden'); });
  }

  // =========================================================
  //  MAIN LOOP & BOOT
  // =========================================================
  G.last = performance.now();
  G.dt = 0;
  var perf = { acc: 0, frames: 0, checked: 0 };

  function frame(now) {
    requestAnimationFrame(frame);
    var dt = (now - G.last) / 1000;
    G.last = now;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;
    G.now = now; G.dt = dt;
    try {
      if (G.state === 'race') {
        updateRace(dt);
        renderRace();
        autoQuality(dt);
      } else if (G.state === 'replay' && G.R && G.replay) {
        replayUpdate(dt);
        renderRace();
      } else if (G.state === 'paused' || G.state === 'results') {
        if (G.state === 'results' && G.R) { updateParts(dt); }
        if (G.R) renderRace();
      } else {
        G.menuT += dt;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        drawTitleBg(ctx, G.menuT, null);
        drawGarage(dt);
      }
    } catch (err) {
      if (window.console) console.error(err);
      G.lastError = String(err && err.stack ? err.stack : err);
    }
  }

  // drop resolution automatically if the device struggles (only in 'auto')
  function autoQuality(dt) {
    if (SAVE.settings.quality !== 'auto' || perf.checked >= 3) return;
    perf.acc += dt; perf.frames++;
    if (perf.acc >= 3) {
      var fps = perf.frames / perf.acc;
      perf.acc = 0; perf.frames = 0; perf.checked++;
      if (fps < 48 && renderScale > 0.6) { renderScale = Math.max(0.6, renderScale * 0.8); resizeCanvas(); }
    }
  }

  function boot() {
    loadSave();
    G.shakeOn = SAVE.settings.shake;
    AU.musicOn = SAVE.settings.music; AU.sfxOn = SAVE.settings.sfx;
    QUALITY = SAVE.settings.quality === 'low' ? 0 : 1;
    resizeCanvas();
    bindUI();
    bindTouchControls();
    bindOnlineUI();
    bindReplayUI();
    if (SAVE.settings.tilt) enableTilt(true);
    applyLang();
    updateToggles();
    showScreen('menu');
    musicPlay(3);
    checkRotate();
    window.addEventListener('resize', function () {
      resizeCanvas(); checkRotate();
      if (G.R) G.cam.z0 = baseZoom();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (G.state === 'race' && G.R && !G.R.done && !isNet(G.R)) pauseGame();
        if (AU.ctx && AU.ctx.state === 'running') AU.ctx.suspend();
      } else if (AU.ctx) AU.ctx.resume();
    });
    var ld = document.getElementById('loading');
    ld.style.opacity = '0';
    setTimeout(function () { ld.classList.add('hidden'); }, 450);
    requestAnimationFrame(frame);
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      var reg = function () { navigator.serviceWorker.register('sw.js').catch(function () { }); };
      if (document.readyState === 'complete') reg(); else window.addEventListener('load', reg);
    }
  }

  // small debug / test hook
  window.NEON_DRIFT = {
    G: G, startRace: startRace, quitToMenu: quitToMenu, showScreen: showScreen, SAVE: function () { return SAVE; },
    setAutopilot: function (on, skill, drift) { G.autopilot = on; G.autopilotDrift = drift === true ? 1 : (drift || 0); G.autopilotSkill = skill === undefined ? 0.85 : skill; if (G.R) G.R.player.ai = null; },
    keys: KEYS, touch: TOUCH, NET: NET, netSend: netSend, netConnect: netConnect, netCreateProfile: netCreateProfile, sendFriendReq: sendFriendReq, acceptReq: acceptReq, netJoin: netJoin, save: save, TRACKS: TRACKS, refLap: refLap, getTrack: getTrack,
    sim: function (seconds, dt) { dt = dt || 1 / 60; for (var i = 0; i < seconds / dt; i++) { G.now += dt * 1000; updateRace(dt); if (G.state !== 'race') break; } }
  };

  if (document.fonts && document.fonts.ready) {
    var booted = false;
    var b = function () { if (!booted) { booted = true; boot(); } };
    document.fonts.ready.then(b);
    setTimeout(b, 1500);
  } else boot();
})();
</script>
</body>
