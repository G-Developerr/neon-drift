<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07030f">
<meta name="description" content="NEON DRIFT — top-down arcade racing with neon synthwave style. Drift, charge your nitro and win.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEON DRIFT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Play:wght@400;700&display=swap" rel="stylesheet">
<title>NEON DRIFT</title>
<style>
:root{
  --bg:#07030f; --pink:#ff2bd6; --cyan:#22f3ff; --violet:#b14dff; --yellow:#ffe14d; --lime:#00ff9c; --red:#ff4d6d;
  --panel:rgba(14,8,32,.78); --line:rgba(34,243,255,.28); --txt:#f4f0ff; --dim:#a99cc9;
  --fd:'Orbitron','Play',system-ui,sans-serif; --fb:'Play',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--fb);overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
canvas#game{position:fixed;inset:0;display:block;width:100vw;height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none!important}

/* ---------- top bar ---------- */
#topbar{position:fixed;top:calc(10px + var(--sat));left:calc(12px + var(--sal));right:calc(12px + var(--sar));display:flex;
  align-items:center;justify-content:space-between;z-index:30;pointer-events:none}
#topbar>*{pointer-events:auto}
.coins{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;background:var(--panel);
  border:1px solid rgba(255,225,77,.45);font-family:var(--fd);font-weight:700;font-size:15px;color:var(--yellow);
  box-shadow:0 0 14px rgba(255,225,77,.18)}
.coin-ic{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7b0,#ffe14d 45%,#c98a00);
  box-shadow:0 0 8px #ffe14d}
.tb-right{display:flex;gap:8px}
.icbtn{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;
  font-family:var(--fd);font-weight:700;font-size:12px;color:var(--cyan);transition:transform .12s,box-shadow .2s}
.icbtn:hover{box-shadow:0 0 14px rgba(34,243,255,.45)}
.icbtn:active{transform:scale(.92)}
.icbtn.off{color:#5a5175;border-color:rgba(255,255,255,.12)}
.icbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  padding:calc(64px + var(--sat)) calc(16px + var(--sar)) calc(96px + var(--sab)) calc(16px + var(--sal));overflow-y:auto;overflow-x:hidden;
  touch-action:pan-y;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.screen.dim{background:radial-gradient(ellipse at center,rgba(10,4,24,.72),rgba(4,2,10,.92))}
.hdr{width:100%;max-width:1100px;display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hdr h2{margin:0;font-family:var(--fd);font-weight:900;font-size:clamp(18px,3.4vw,30px);letter-spacing:2px;
  background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(255,43,214,.45))}
.backbtn{padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-family:var(--fd);font-size:13px;color:var(--cyan)}
.backbtn:active{transform:scale(.95)}

/* ---------- main menu ---------- */
#scr-menu{justify-content:center;padding-top:calc(54px + var(--sat));padding-bottom:calc(20px + var(--sab))}
.logo{font-family:var(--fd);font-weight:900;font-size:clamp(40px,9vw,104px);letter-spacing:.06em;line-height:1;margin:0;text-align:center;
  color:#fff;text-shadow:0 0 6px #fff,0 0 18px var(--pink),0 0 40px var(--pink),0 0 70px #a0108a;animation:flick 6s infinite}
.logo span{color:#eaffff;text-shadow:0 0 6px #fff,0 0 18px var(--cyan),0 0 40px var(--cyan),0 0 70px #0a7d8a}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.55}}
.tagline{font-family:var(--fd);font-size:clamp(11px,1.6vw,15px);letter-spacing:.3em;color:var(--cyan);margin:10px 0 clamp(14px,3vh,30px);text-align:center;text-transform:uppercase;opacity:.9}
.modes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;width:100%;max-width:1240px}
.mode{position:relative;padding:16px 14px;border-radius:16px;text-align:left;background:linear-gradient(160deg,rgba(30,12,60,.85),rgba(10,5,24,.85));
  border:1px solid rgba(255,255,255,.12);overflow:hidden;transition:transform .15s,box-shadow .2s,border-color .2s;min-height:96px}
.mode::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.07) 50%,transparent 60%);transform:translateX(-100%);transition:transform .6s}
.mode:hover::before{transform:translateX(100%)}
.mode:hover,.mode:focus-visible{transform:translateY(-3px);border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 45%,transparent)}
.mode:active{transform:scale(.97)}
.mode b{display:block;font-family:var(--fd);font-weight:900;font-size:clamp(13px,1.7vw,18px);letter-spacing:1px;color:var(--c);text-shadow:0 0 12px var(--c)}
.mode small{display:block;margin-top:6px;color:var(--dim);font-size:clamp(11px,1.25vw,13px);line-height:1.3}
.mode i{position:absolute;right:10px;bottom:8px;font-style:normal;font-family:var(--fd);font-size:28px;opacity:.15;color:var(--c)}
.sub-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.pill{padding:11px 20px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:1px;color:var(--txt);transition:box-shadow .2s,transform .12s}
.pill:hover{box-shadow:0 0 16px rgba(34,243,255,.4)}
.pill:active{transform:scale(.95)}
.pill.hot{border-color:var(--pink);color:#fff;background:linear-gradient(90deg,rgba(255,43,214,.35),rgba(34,243,255,.25));box-shadow:0 0 18px rgba(255,43,214,.35)}
.pill[disabled]{opacity:.4;pointer-events:none}

/* ---------- cards ---------- */
.grid{display:grid;gap:12px;width:100%;max-width:1100px}
.cups{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{border-radius:16px;background:var(--panel);border:1px solid rgba(255,255,255,.1);padding:14px;position:relative}
.cup h3{margin:0 0 4px;font-family:var(--fd);font-size:15px;letter-spacing:1px;color:var(--c);text-shadow:0 0 10px var(--c)}
.cup .meta{color:var(--dim);font-size:12px;margin-bottom:10px}
.race{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 12px;margin-top:7px;border-radius:12px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:14px;text-align:left;transition:border-color .2s,background .2s}
.race:hover{border-color:var(--c);background:rgba(255,255,255,.08)}
.race.locked{opacity:.4;pointer-events:none}
.stars{font-family:var(--fd);letter-spacing:2px;color:#4a3f66}
.stars .on{color:var(--yellow);text-shadow:0 0 8px var(--yellow)}
.lockmsg{margin-top:10px;color:var(--red);font-size:12px}
.tracks{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.trk{padding:10px;text-align:left;transition:transform .15s,border-color .2s;cursor:pointer}
.trk:hover{transform:translateY(-2px);border-color:var(--cyan)}
.trk canvas{width:100%;height:auto;aspect-ratio:16/10;border-radius:10px;display:block;background:#05020c}
.trk b{display:block;margin-top:8px;font-family:var(--fd);font-size:13px;letter-spacing:1px}
.trk small{color:var(--dim);font-size:12px}
.trk.locked{opacity:.35;pointer-events:none}
.medal{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:6px;vertical-align:-1px}
.m3{background:radial-gradient(circle at 35% 35%,#fff7b0,#ffe14d 50%,#b07a00);box-shadow:0 0 8px #ffe14d}
.m2{background:radial-gradient(circle at 35% 35%,#fff,#c9d4e6 50%,#6f7d96);box-shadow:0 0 8px #c9d4e6}
.m1{background:radial-gradient(circle at 35% 35%,#ffd9b0,#d9893f 50%,#7a3f10);box-shadow:0 0 8px #d9893f}

/* ---------- garage ---------- */
.garage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;width:100%;max-width:1100px}
.gprev{position:relative;padding:0;overflow:hidden;height:min(62vh,440px);min-height:220px;display:flex;flex-direction:column;align-self:start;position:sticky;top:0}
.gprev canvas{width:100%;flex:1;min-height:0;display:block}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.4);border:1px solid var(--line);
  font-family:var(--fd);font-size:20px;color:var(--cyan)}
.gnav.l{left:10px}.gnav.r{right:10px}
.gname{position:absolute;left:0;right:0;top:12px;text-align:center;font-family:var(--fd);font-weight:900;font-size:22px;letter-spacing:3px;text-shadow:0 0 14px var(--pink)}
.gprice{position:absolute;left:0;right:0;bottom:12px;text-align:center}
.stat{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.bar{height:9px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--violet),var(--cyan))}
.bar u{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--pink),var(--yellow));border-radius:0 9px 9px 0}
.upg{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.pips{display:flex;gap:4px}.pips span{flex:1;height:8px;border-radius:3px;background:rgba(255,255,255,.1)}
.pips span.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.small-btn{padding:7px 10px;border-radius:10px;border:1px solid rgba(255,225,77,.5);color:var(--yellow);font-family:var(--fd);font-size:11px;min-width:76px;background:rgba(255,225,77,.08)}
.small-btn[disabled]{opacity:.35;pointer-events:none}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.2);position:relative}
.sw.sel{border-color:#fff;box-shadow:0 0 12px #fff}
.sw.lock::after{content:attr(data-p);position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:9px;color:var(--yellow);white-space:nowrap}
.sec{font-family:var(--fd);font-size:12px;letter-spacing:2px;color:var(--cyan);margin:12px 0 4px;text-transform:uppercase}

/* ---------- tables / settings ---------- */
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{font-family:var(--fd);font-size:11px;letter-spacing:1px;color:var(--cyan);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.tb td{padding:8px;border-bottom:1px solid rgba(255,255,255,.06)}
.tb tr.me td{color:var(--yellow);font-weight:700}
.tb td.num{font-family:var(--fd);font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);font-size:13px;font-family:var(--fd)}
.tab.sel{border-color:var(--pink);background:rgba(255,43,214,.18);color:#fff}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px}
.tog{min-width:70px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-family:var(--fd);font-size:12px}
.tog.on{border-color:var(--lime);color:var(--lime);box-shadow:0 0 10px rgba(0,255,156,.3)}
input.nm{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--txt);font-family:var(--fd);width:150px;text-transform:uppercase}
.help{color:var(--dim);font-size:13px;line-height:1.5;margin-top:12px}

/* ---------- pause / results ---------- */
.modal{width:100%;max-width:640px;margin:auto 0;text-align:center}
.modal h2{font-family:var(--fd);font-weight:900;font-size:clamp(24px,5vw,40px);margin:0 0 6px;letter-spacing:3px;color:#fff;text-shadow:0 0 18px var(--pink)}
.modal .btns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:16px}
.modal .btns.row{flex-direction:row;justify-content:center;flex-wrap:wrap}
.bigbtn{min-width:220px;padding:13px 22px;border-radius:14px;font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:2px;
  border:1px solid var(--line);background:var(--panel);transition:box-shadow .2s,transform .12s}
.bigbtn:hover{box-shadow:0 0 18px rgba(34,243,255,.45)}
.bigbtn:active{transform:scale(.96)}
.bigbtn.hot{border-color:var(--pink);background:linear-gradient(90deg,rgba(255,43,214,.4),rgba(34,243,255,.3));color:#fff}
.res-big{font-family:var(--fd);font-weight:900;font-size:clamp(34px,7vw,64px);margin:4px 0;text-shadow:0 0 22px currentColor}
.res-sub{color:var(--dim);margin-bottom:10px}
.reward{display:inline-flex;gap:10px;align-items:center;margin:10px 0;padding:8px 16px;border-radius:999px;border:1px solid rgba(255,225,77,.5);
  color:var(--yellow);font-family:var(--fd);font-weight:700;background:rgba(255,225,77,.08)}
.res-stars{font-size:34px;letter-spacing:6px}
.unlock{color:var(--lime);font-family:var(--fd);font-size:13px;margin-top:8px;text-shadow:0 0 10px var(--lime)}

/* ---------- HUD buttons & touch controls ---------- */
#hudBtns{position:fixed;top:calc(10px + var(--sat));right:calc(12px + var(--sar));z-index:15}
#touch{position:fixed;inset:0;z-index:14;pointer-events:none}
#touch>*{pointer-events:auto;position:absolute}
#steerPad{left:calc(12px + var(--sal));bottom:calc(14px + var(--sab));width:min(36vw,280px);height:min(30vh,150px);display:flex;gap:10px;touch-action:none}
.tbtn{flex:1;border-radius:22px;border:2px solid rgba(34,243,255,.45);background:rgba(10,5,30,.35);display:grid;place-items:center;
  font-family:var(--fd);font-size:28px;color:rgba(34,243,255,.85);transition:background .08s,box-shadow .08s;touch-action:none}
.tbtn.on{background:rgba(34,243,255,calc(.12 + var(--amt,1) * .3));box-shadow:0 0 calc(8px + var(--amt,1) * 18px) rgba(34,243,255,.6);color:#fff}
.rbtn{border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:900;font-size:13px;letter-spacing:1px;touch-action:none;
  background:rgba(10,5,30,.4);transition:background .08s,box-shadow .08s}
#bDrift{right:calc(18px + var(--sar));bottom:calc(18px + var(--sab));width:min(19vh,108px);height:min(19vh,108px);border:2px solid rgba(255,43,214,.6);color:#ffb3f1}
#bDrift.on{background:rgba(255,43,214,.35);box-shadow:0 0 26px rgba(255,43,214,.7)}
#bNitro{right:calc(28px + var(--sar) + min(19vh,108px));bottom:calc(64px + var(--sab));width:min(15vh,80px);height:min(15vh,80px);border:2px solid rgba(177,77,255,.7);color:#d9b3ff}
#bNitro.on{background:rgba(177,77,255,.4);box-shadow:0 0 24px rgba(177,77,255,.8)}
#bBrake{right:calc(28px + var(--sar) + min(19vh,108px));bottom:calc(10px + var(--sab));width:min(10vh,54px);height:min(10vh,54px);border:2px solid rgba(255,77,109,.6);color:#ffb3c0;font-size:10px}
#bBrake.on{background:rgba(255,77,109,.35)}
#bGas{right:calc(18px + var(--sar));bottom:calc(30px + var(--sab) + min(19vh,108px));width:min(13vh,70px);height:min(13vh,70px);border:2px solid rgba(0,255,156,.6);color:#b3ffe0;font-size:11px}
#bGas.on{background:rgba(0,255,156,.3)}

/* ---------- G-navos button ---------- */
#gnavos{position:fixed;right:calc(14px + var(--sar));bottom:calc(14px + var(--sab));z-index:40;width:74px;height:74px;border-radius:50%;
  display:grid;place-items:center;text-align:center;text-decoration:none;color:#fff;font-family:var(--fd);font-weight:700;font-size:9.5px;line-height:1.15;letter-spacing:.5px;
  background:radial-gradient(circle at 30% 30%,rgba(255,43,214,.55),rgba(20,5,40,.92) 70%);border:2px solid var(--pink);
  box-shadow:0 0 14px rgba(255,43,214,.6),inset 0 0 12px rgba(34,243,255,.35);animation:gpulse 2.6s ease-in-out infinite}
#gnavos:hover{transform:scale(1.06)}
@keyframes gpulse{0%,100%{box-shadow:0 0 12px rgba(255,43,214,.55),inset 0 0 10px rgba(34,243,255,.3)}50%{box-shadow:0 0 26px rgba(34,243,255,.7),inset 0 0 14px rgba(255,43,214,.45);border-color:var(--cyan)}}

#toast{position:fixed;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);z-index:60;max-width:min(92vw,620px);padding:12px 18px;border-radius:14px;
  background:rgba(14,8,32,.92);border:1px solid var(--pink);box-shadow:0 0 22px rgba(255,43,214,.4);font-size:14px;line-height:1.4;text-align:center;pointer-events:none;
  transition:opacity .3s;opacity:0}
#toast.show{opacity:1}
#toast.low{top:auto;bottom:calc(96px + var(--sab))}
#rotate{position:fixed;inset:0;z-index:80;background:rgba(5,2,12,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#rotate .ph{width:60px;height:100px;border:3px solid var(--cyan);border-radius:12px;box-shadow:0 0 18px var(--cyan);animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#loading{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;font-family:var(--fd);letter-spacing:6px;color:var(--pink);text-shadow:0 0 14px var(--pink);transition:opacity .4s}

/* ---------- online ---------- */
.badge{position:absolute;top:8px;right:8px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-family:var(--fd);font-size:12px;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 10px var(--red);font-style:normal}
.mode.online{background:linear-gradient(160deg,rgba(80,30,10,.85),rgba(20,6,24,.9))}
.netst{display:inline-flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--dim)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.on-grid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
.card h3{margin:0 0 8px;font-family:var(--fd);font-size:15px;letter-spacing:1px;color:var(--cyan)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.frow{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.frow>span:first-child:not(.dot){flex:1}
.fname{flex:1;display:flex;flex-direction:column;line-height:1.25}
.fname small,.frow small{color:var(--dim);font-size:11px}
.small-btn.hot{border-color:var(--pink);color:#fff;background:rgba(255,43,214,.2)}
.code{font-family:var(--fd);letter-spacing:2px;color:var(--yellow)}
.code.small{font-size:11px;letter-spacing:1px}
input.nm.wide{width:100%;text-transform:uppercase}
.roomcode{font-family:var(--fd);font-weight:900;font-size:24px;letter-spacing:5px;color:var(--yellow);text-shadow:0 0 14px var(--yellow);margin-left:auto}
.lobby{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:12px;width:100%;max-width:1100px;align-items:start}
.team h3{text-align:center;font-size:18px}
.team.t0{border-color:rgba(255,43,214,.5);box-shadow:0 0 18px rgba(255,43,214,.15)}.team.t0 h3{color:var(--pink);text-shadow:0 0 12px var(--pink)}

(function () {

  // ---------- math helpers ----------
  var PI = Math.PI, TAU = Math.PI * 2;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function sign(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }
  function wrapAngle(a) {
    while (a > PI) a -= TAU;

  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function fmtTime(t) {
    if (!(t >= 0) || t === Infinity) return '--:--.--';

    if (s < 10) ss = '0' + ss;
    return m + ':' + ss;
  }
  function fmtNum(n) {
    n = Math.round(n);
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function hexToRgb(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];

  function rgba(hex, a) {
    var c = hexToRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  function makeCanvas(w, h) {
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w));

  }

  // ---------- world constants ----------

      var b2x = (t3 - t) / (t3 - t1) * a2x + (t - t1) / (t3 - t1) * a3x;

      out.push([(t2 - t) / (t2 - t1) * b1x + (t - t1) / (t2 - t1) * b2x, (t2 - t) / (t2 - t1) * b1y + (t - t1) / (t2 - t1) * b2y]);
    }
  }

  function genCtrl(def, seed) {
    var r = mulberry32(seed * 7919 + def.n * 31 + 17);
    var pts = [];
    var rot = r() * TAU;
    for (var i = 0; i < def.n; i++) {
      var ang = i / def.n * TAU + (r() - 0.5) * (TAU / def.n) * 0.55;
      var rad = def.R * (def.rMin + (1 - def.rMin) * r());
      var x = Math.cos(ang) * rad * def.sx, y = Math.sin(ang) * rad * def.sy;
      pts.push([x * Math.cos(rot) - y * Math.sin(rot), x * Math.sin(rot) + y * Math.cos(rot)]);
    }
    return pts;
  }

  function newTrackObj(closed, themeKey) {
    return {
      closed: closed, theme: THEMES[themeKey], themeKey: themeKey,
      px: [], py: [], tx: [], ty: [], d: [], k: [], safe: [], rl: [],
      n: 0, L: 0, spacing: SP,
      buckets: new Map(), decos: [], pads: [], cps: [], dirtyTiles: [],
      minX: 1e9, minY: 1e9, maxX: -1e9, maxY: -1e9
    };
  }

  // resample a dense closed polyline to uniform spacing
  function resampleClosed(dense) {
    var n = dense.length, cum = [0], i;
    for (i = 1; i <= n; i++) {
      var a = dense[i - 1], b = dense[i % n];
      cum.push(cum[i - 1] + Math.sqrt(dist2(a[0], a[1], b[0], b[1])));
    }
    var L = cum[n];
    var N = Math.max(16, Math.round(L / SP));
    var sp = L / N, out = [], j = 0;
    for (i = 0; i < N; i++) {
      var s = i * sp;
      while (cum[j + 1] < s) j++;
      var seg = cum[j + 1] - cum[j];
      var t = seg > 0 ? (s - cum[j]) / seg : 0;
      var p = dense[j], q = dense[(j + 1) % n];
      out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]);
    }
    return { pts: out, L: L, sp: sp };
  }

  function computeTangents(T, from, to) {
    var n = T.n;
    for (var i = from; i < to; i++) {
      var a, b;
      if (T.closed) { a = (i - 1 + n) % n; b = (i + 1) % n; }
      else { a = Math.max(0, i - 1); b = Math.min(n - 1, i + 1); }
      var dx = T.px[b] - T.px[a], dy = T.py[b] - T.py[a];
      var l = Math.sqrt(dx * dx + dy * dy) || 1;
      T.tx[i] = dx / l; T.ty[i] = dy / l;
    }
  }

  function computeCurvature(T, from, to) {
    var n = T.n, w = 4;
    for (var i = from; i < to; i++) {
      var a, b;
      if (T.closed) { a = (i - w + n) % n; b = (i + w) % n; }
      else { a = Math.max(0, i - w); b = Math.min(n - 1, i + w); }
      var a1 = Math.atan2(T.ty[a], T.tx[a]), a2 = Math.atan2(T.ty[b], T.tx[b]);
      var span = (T.closed ? 2 * w : Math.max(1, b - a)) * T.spacing;
      T.k[i] = wrapAngle(a2 - a1) / span;
    }
  }

  function idxW(T, i) { if (T.closed) { i %= T.n; if (i < 0) i += T.n; return i; } return clamp(i, 0, T.n - 1); }

  function computeRacing(T) {
    var n = T.n, i, j;
    var raw = new Array(n);
    for (i = 0; i < n; i++) {
      var k = T.k[i];
      raw[i] = sign(k) * Math.min(1, Math.abs(k) * 420) * HALF_W * 0.55;
    }
    // smooth (box filter twice)
    for (var pass = 0; pass < 2; pass++) {
      var sm = new Array(n), W = 22;
      for (i = 0; i < n; i++) {
        var s = 0;
        for (j = -W; j <= W; j++) s += raw[idxW(T, i + j)];
        sm[i] = s / (2 * W + 1);

      raw = sm;
    }
    T.rl = raw;
    // safe-speed profile (generic; AI scales it)
    var C = 2.4, B = 1150, CAP = 1500;
    var s0 = new Array(n);
    for (i = 0; i < n; i++) {
      var km = 0;
      for (j = 0; j < 6; j++) km = Math.max(km, Math.abs(T.k[idxW(T, i + j)]));
      s0[i] = Math.min(CAP, C / Math.max(km, 1e-5));
    }
    for (pass = 0; pass < 2; pass++) {
      for (i = n - 1; i >= 0; i--) {
        var nx = s0[idxW(T, i + 1)];
        var lim = Math.sqrt(nx * nx + 2 * B * T.spacing);
        if (s0[i] > lim) s0[i] = lim;
      }
    }
    T.safe = s0;
  }

  function tileKey(tx, ty) { return tx + ',' + ty; }
  function addToBuckets(T, x0, y0, x1, y1, item, listName) {
    var a = Math.floor(x0 / TILE), b = Math.floor(x1 / TILE), c = Math.floor(y0 / TILE), d = Math.floor(y1 / TILE);
    for (var tx = a; tx <= b; tx++) for (var ty = c; ty <= d; ty++) {
      var key = tileKey(tx, ty);
      var bk = T.buckets.get(key);
      if (!bk) { bk = { segs: [], decos: [] }; T.buckets.set(key, bk); }
      bk[listName].push(item);
      if (T.tileCache && T.tileCache.has(key)) T.dirtyTiles.push(key);
    }
  }
  function markDirty(T, x0, y0, x1, y1) {
    if (!T.tileCache) return;
    for (var tx = Math.floor(x0 / TILE); tx <= Math.floor(x1 / TILE); tx++)
      for (var ty = Math.floor(y0 / TILE); ty <= Math.floor(y1 / TILE); ty++) {
        var key = tileKey(tx, ty);
        if (T.tileCache.has(key)) T.dirtyTiles.push(key);
      }
  }
  function bucketSegments(T, from, to) {
    var m = HALF_W + 70;
    for (var i = from; i < to; i++) {
      var j = T.closed ? (i + 1) % T.n : Math.min(i + 1, T.n - 1);
      var x0 = Math.min(T.px[i], T.px[j]) - m, x1 = Math.max(T.px[i], T.px[j]) + m;
      var y0 = Math.min(T.py[i], T.py[j]) - m, y1 = Math.max(T.py[i], T.py[j]) + m;
      addToBuckets(T, x0, y0, x1, y1, i, 'segs');
      if (T.px[i] < T.minX) T.minX = T.px[i];
      if (T.py[i] < T.minY) T.minY = T.py[i];
      if (T.px[i] > T.maxX) T.maxX = T.px[i];
      if (T.py[i] > T.maxY) T.maxY = T.py[i];
    }
  }

  // coarse spatial grid of track points for "is this spot clear of the road" queries
  var CG = 256;
  function coarseAdd(T, from, to) {
    if (!T.coarse) T.coarse = new Map();
    for (var i = from; i < to; i++) {
      var key = Math.floor(T.px[i] / CG) + ',' + Math.floor(T.py[i] / CG);
      var arr = T.coarse.get(key);
      if (!arr) { arr = []; T.coarse.set(key, arr); }
      arr.push(i);
    }
  }
  function roadDist(T, x, y, maxR) {
    var best = 1e12, cx = Math.floor(x / CG), cy = Math.floor(y / CG), rr = Math.ceil(maxR / CG) + 1;
    for (var a = -rr; a <= rr; a++) for (var b = -rr; b <= rr; b++) {
      var arr = T.coarse.get((cx + a) + ',' + (cy + b));
      if (!arr) continue;
      for (var q = 0; q < arr.length; q++) {
        var i = arr[q], d = dist2(x, y, T.px[i], T.py[i]);
        if (d < best) best = d;
      }
    }
    return Math.sqrt(best);
  }

  // ---------- decorations ----------
  function placeDecos(T, from, to, rng) {
    var th = T.theme, kind = th.deco, i;
    var count = Math.floor((to - from) * T.spacing / 95);
    for (var c = 0; c < count; c++) {
      i = from + Math.floor(rng() * (to - from));
      var side = rng() < 0.5 ? -1 : 1;
      var off = HALF_W + 70 + Math.pow(rng(), 1.4) * 780;
      var nx = -T.ty[i], ny = T.tx[i];
      var x = T.px[i] + nx * off * side + (rng() - 0.5) * 120;
      var y = T.py[i] + ny * off * side + (rng() - 0.5) * 120;
      var d = makeDeco(kind, x, y, rng, T.tx[i], T.ty[i]);
      if (roadDist(T, x, y, d.r + HALF_W + 60) < d.r + HALF_W + 40) continue;
      T.decos.push(d);
      addToBuckets(T, x - d.r - 20, y - d.r - 20, x + d.r + 20, y + d.r + 20, d, 'decos');
    }
    // neon lamps along both edges
    var step = Math.round(300 / T.spacing);
    var start = Math.ceil(from / step) * step;
    for (i = start; i < to; i += step) {
      for (var sd = -1; sd <= 1; sd += 2) {
        var lx = T.px[i] + (-T.ty[i]) * (HALF_W + 30) * sd, ly = T.py[i] + T.tx[i] * (HALF_W + 30) * sd;
        if (roadDist(T, lx, ly, HALF_W + 60) < HALF_W + 22) continue;
        var lamp = { t: 'lamp', x: lx, y: ly, r: 34, col: sd < 0 ? th.edgeA : th.edgeB };
        T.decos.push(lamp);
        addToBuckets(T, lx - 40, ly - 40, lx + 40, ly + 40, lamp, 'decos');
      }
    }
  }

  function makeDeco(kind, x, y, rng, tx, ty) {
    var d = { x: x, y: y, seed: Math.floor(rng() * 1e9), rot: Math.atan2(ty, tx) + (rng() < 0.5 ? 0 : PI / 2) };
    if (kind === 'city') {
      d.t = 'building'; d.w = 90 + rng() * 170; d.h = 90 + rng() * 170; d.r = Math.hypot(d.w, d.h) / 2;
    } else if (kind === 'palms') {
      if (rng() < 0.6) { d.t = 'palm'; d.r = 40 + rng() * 25; } else { d.t = 'building'; d.w = 80 + rng() * 120; d.h = 80 + rng() * 120; d.r = Math.hypot(d.w, d.h) / 2; }
    } else if (kind === 'desert') {
      var q = rng();
      if (q < 0.35) { d.t = 'cactus'; d.r = 26 + rng() * 18; }
      else if (q < 0.75) { d.t = 'rock'; d.r = 30 + rng() * 60; }
      else { d.t = 'dune'; d.r = 90 + rng() * 120; }
    } else if (kind === 'snow') {
      if (rng() < 0.65) { d.t = 'pine'; d.r = 30 + rng() * 30; } else { d.t = 'snowpile'; d.r = 40 + rng() * 70; }
    } else if (kind === 'tunnel') {
      d.t = rng() < 0.6 ? 'pillar' : 'vent'; d.r = 30 + rng() * 40; d.w = d.r * 1.4; d.h = d.r * 1.4;
    } else if (kind === 'harbor') {
      var hq = rng();
      if (hq < 0.55) { d.t = 'container'; d.w = 70 + rng() * 60; d.h = 26 + rng() * 6; d.r = Math.hypot(d.w, d.h) / 2; d.col = pick(['#ff3d6e', '#22a8ff', '#ffb000', '#00d68f', '#b14dff', '#ff7a00'], rng()); }
      else if (hq < 0.7) { d.t = 'crane'; d.r = 90 + rng() * 40; }
      else { d.t = 'water'; d.r = 110 + rng() * 140; }
    } else if (kind === 'volcano') {
      var vq = rng();
      if (vq < 0.35) { d.t = 'lava'; d.r = 50 + rng() * 90; }
      else if (vq < 0.8) { d.t = 'rock'; d.r = 30 + rng() * 60; }
      else { d.t = 'crack'; d.r = 80 + rng() * 80; }
    } else if (kind === 'space') {
      var sq = rng();
      if (sq < 0.18) { d.t = 'planet'; d.r = 70 + rng() * 120; }
      else if (sq < 0.55) { d.t = 'station'; d.w = 70 + rng() * 120; d.h = 50 + rng() * 80; d.r = Math.hypot(d.w, d.h) / 2; }
      else { d.t = 'asteroid'; d.r = 18 + rng() * 40; }
    } else {
      d.t = 'datablock'; d.w = 60 + rng() * 140; d.h = 60 + rng() * 140; d.r = Math.hypot(d.w, d.h) / 2;
    }
    return d;
  }

  function placePads(T, rng) {
    // boost pads on the straightest sections
    var n = T.n, cand = [], i;
    for (i = 0; i < n; i += 6) {
      var km = 0;
      for (var j = -30; j <= 30; j += 3) km = Math.max(km, Math.abs(T.k[idxW(T, i + j)]));
      if (km < 0.0012 && i > 40 && i < n - 40) cand.push({ i: i, km: km });
    }
    cand.sort(function (a, b) { return a.km - b.km; });
    var chosen = [], want = Math.max(2, Math.min(4, Math.round(T.L / 6000)));
    for (i = 0; i < cand.length && chosen.length < want; i++) {
      var ok = true;
      for (var q = 0; q < chosen.length; q++) {
        var dd = Math.abs(cand[i].i - chosen[q].i);
        dd = Math.min(dd, n - dd);
        if (dd * T.spacing < 2400) ok = false;
      }
      if (ok) chosen.push(cand[i]);
    }
    for (i = 0; i < chosen.length; i++) addPad(T, chosen[i].i, (rng() - 0.5) * HALF_W * 0.8);
  }
  function addPad(T, i, off) {
    var nx = -T.ty[i], ny = T.tx[i];
    T.pads.push({ i: i, off: off, x: T.px[i] + nx * off, y: T.py[i] + ny * off, a: Math.atan2(T.ty[i], T.tx[i]) });
  }

  // ---------- closed track build ----------
  function buildClosedFromCtrl(ctrl, themeKey, seed) {
    var dense = [], n = ctrl.length;
    for (var i = 0; i < n; i++) {
      catmull(ctrl[(i - 1 + n) % n], ctrl[i], ctrl[(i + 1) % n], ctrl[(i + 2) % n], 40, dense);
    }
    var rs = resampleClosed(dense);
    var T = newTrackObj(true, themeKey);
    T.n = rs.pts.length; T.L = rs.L; T.spacing = rs.sp;
    for (i = 0; i < T.n; i++) { T.px.push(rs.pts[i][0]); T.py.push(rs.pts[i][1]); T.d.push(i * rs.sp); }
    computeTangents(T, 0, T.n);
    computeCurvature(T, 0, T.n);
    // rotate so the start line sits on the straightest stretch
    var bestI = 0, bestK = 1e9;
    for (i = 0; i < T.n; i += 2) {
      var km = 0;
      for (var q = -45; q <= 70; q += 3) km = Math.max(km, Math.abs(T.k[idxW(T, i + q)]));
      if (km < bestK) { bestK = km; bestI = i; }
    }
    if (bestI) {
      var rot = function (a) { return a.slice(bestI).concat(a.slice(0, bestI)); };
      T.px = rot(T.px); T.py = rot(T.py); T.tx = rot(T.tx); T.ty = rot(T.ty); T.k = rot(T.k);
    }
    return T;
  }

  // checks: no close approach between distant sections, no too-tight corners
  function validateTrack(T) {
    var n = T.n, minGap = TRACK_W + 170, i, j;
    var skip = Math.ceil((TRACK_W * 3.2) / T.spacing);
    for (i = 0; i < n; i += 2) {
      for (j = i + skip; j < n; j += 2) {
        var dd = Math.min(j - i, n - (j - i));
        if (dd < skip) continue;
        if (dist2(T.px[i], T.py[i], T.px[j], T.py[j]) < minGap * minGap) return 'gap';
      }
    }
    var kmax = 0;
    for (i = 0; i < n; i++) kmax = Math.max(kmax, Math.abs(T.k[i]));
    if (kmax > 1 / 135) return 'tight';
    return 'ok';
  }

  function buildTrack(def) {
    var ctrl = genCtrl(def, def.seed);
    var T = buildClosedFromCtrl(ctrl, def.theme, def.seed);
    T.def = def;
    finalizeClosed(T, def.seed);
    return T;
  }
  function finalizeClosed(T, seed) {
    computeRacing(T);
    coarseAdd(T, 0, T.n);
    bucketSegments(T, 0, T.n);
    var rng = mulberry32(seed * 131 + 7);
    placePads(T, rng);
    placeDecos(T, 0, T.n, rng);
  }

  // ---------- endless (procedural) track ----------
  function buildEndless(themeKey, seed) {
    var T = newTrackObj(false, themeKey);
    T.rng = mulberry32(seed);
    T.nodes = [[0, 600], [0, 0], [0, -500]];
    T.heading = -PI / 2;
    T.segBuilt = 0;            // spline segments generated
    T.rsAcc = 0; T.rsPrev = null;
    T.nextCp = 4000; T.nextPad = 1500; T.decoFrom = 0;
    extendEndless(T, 4000);
    return T;
  }
  function addEndlessNode(T) {
    var r = T.rng, last = T.nodes[T.nodes.length - 1];
    var up = -PI / 2;
    T.heading += (r() - 0.5) * 1.25;
    T.heading = clamp(T.heading, up - 0.9, up + 0.9);
    // drift back toward 'up' slowly so the road keeps advancing
    T.heading = lerp(T.heading, up, 0.12);
    var step = 420 + r() * 420;
    T.nodes.push([last[0] + Math.cos(T.heading) * step, last[1] + Math.sin(T.heading) * step]);
  }
  function extendEndless(T, untilLen) {
    var startN = T.n;
    while (T.L < untilLen) {
      while (T.nodes.length < T.segBuilt + 4) addEndlessNode(T);
      var k = T.segBuilt, nd = T.nodes;
      var p0 = k === 0 ? [nd[0][0], nd[0][1] + 500] : nd[k - 1];
      var dense = [];
      catmull(p0, nd[k], nd[k + 1], nd[k + 2], 30, dense);
      if (k === 0) dense.unshift(nd[0].slice());
      T.segBuilt++;
      // incremental uniform resample
      for (var q = 0; q < dense.length; q++) {
        var pt = dense[q];
        if (!T.rsPrev) { pushPt(T, pt[0], pt[1]); T.rsPrev = pt; T.rsAcc = 0; continue; }
        var ax = T.rsPrev[0], ay = T.rsPrev[1];
        var seg = Math.sqrt(dist2(ax, ay, pt[0], pt[1]));
        while (T.rsAcc + seg >= SP) {
          var t = (SP - T.rsAcc) / seg;
          ax += (pt[0] - ax) * t; ay += (pt[1] - ay) * t;

          seg = Math.sqrt(dist2(ax, ay, pt[0], pt[1]));

        T.rsAcc += seg;

      }

    var from = Math.max(0, startN - 2);
    computeTangents(T, from, T.n);
    computeCurvature(T, Math.max(0, startN - 6), T.n);
    coarseAdd(T, startN, T.n);
    bucketSegments(T, Math.max(0, startN - 1), T.n);
    // remove decorations that the new road now overlaps
    for (var di = 0; di < T.decos.length; di++) {
      var dc = T.decos[di];
      var lim = dc.t === 'lamp' ? HALF_W + 22 : dc.r + HALF_W + 20;
      if (!dc.dead && roadDist(T, dc.x, dc.y, lim + 40) < lim) {
        dc.dead = true;
        markDirty(T, dc.x - dc.r - 20, dc.y - dc.r - 20, dc.x + dc.r + 20, dc.y + dc.r + 20);
      }
    }
    // checkpoints & pads
    while (T.nextCp < T.L - 200) {
      var ci = Math.round(T.nextCp / SP);
      T.cps.push({ i: ci, d: T.nextCp, done: false });
      T.nextCp += 5000 + T.cps.length * 300;
    }
    while (T.nextPad < T.L - 200) {
      var pi = Math.round(T.nextPad / SP);
      addPad(T, pi, (T.rng() - 0.5) * HALF_W * 0.9);
      T.nextPad += 1300 + T.rng() * 1400;

    // decorations (lag one chunk so the road ahead is known)
    var decoTo = Math.max(T.decoFrom, T.n - 120);
    if (decoTo > T.decoFrom + 20) {
      placeDecos(T, T.decoFrom, decoTo, T.rng);
      T.decoFrom = decoTo;
    }
  }
  function pushPt(T, x, y) {
    if (T.n > 0) T.L += Math.sqrt(dist2(T.px[T.n - 1], T.py[T.n - 1], x, y));
    T.px.push(x); T.py.push(y); T.tx.push(0); T.ty.push(-1); T.k.push(0); T.d.push(T.L);
    T.n++;
  }

  // ---------- locate a point on the track ----------
  // writes into out: i (segment), t, lat (signed lateral, + = right), dAlong
  function locate(T, x, y, hint, out) {
    var n = T.n, best = 1e18, bi = 0, bt = 0, from, to, i;
    if (hint < 0 || hint >= n) { from = 0; to = n; }
    else { from = hint - 14; to = hint + 15; }
    var segs = T.closed ? n : n - 1;
    for (var q = from; q < to; q++) {
      i = q;

      var ax = T.px[i], ay = T.py[i], bx = T.px[j] - ax, by = T.py[j] - ay;
      var ll = bx * bx + by * by;
      var t = ll > 0 ? ((x - ax) * bx + (y - ay) * by) / ll : 0;
      t = clamp(t, 0, 1);
      var cx = ax + bx * t, cy = ay + by * t;
      var dd = dist2(x, y, cx, cy);
      if (dd < best) { best = dd; bi = i; bt = t; }
    }
    if (hint >= 0 && best > (TRACK_W * 2) * (TRACK_W * 2)) return locate(T, x, y, -1, out);
    var j2 = T.closed ? (bi + 1) % n : Math.min(bi + 1, n - 1);
    var txx = lerp(T.tx[bi], T.tx[j2], bt), tyy = lerp(T.ty[bi], T.ty[j2], bt);
    var tl = Math.sqrt(txx * txx + tyy * tyy) || 1;

      g.fillRect(stars[i][0] * w, stars[i][1] * h, 1.6, 1.6);
    }
    g.globalAlpha = 1;
    // sun
    var R = Math.min(w, h) * 0.24, sx = w / 2, sy = hz - R * 0.25;
    g.save();
    g.beginPath(); g.arc(sx, sy, R, 0, TAU); g.clip();
    var sg = g.createLinearGradient(0, sy - R, 0, sy + R);
    sg.addColorStop(0, '#ffe14d'); sg.addColorStop(0.5, '#ff8a00'); sg.addColorStop(1, '#ff2bd6');
    g.fillStyle = sg; g.fillRect(sx - R, sy - R, R * 2, R * 2);
    g.fillStyle = c0;
    for (i = 0; i < 7; i++) {
      var yy = sy + R * 0.05 + i * R * 0.14 + ((t * 12) % (R * 0.14));
      g.fillRect(sx - R, yy, R * 2, 2 + i * 1.6);
    }
    g.restore();
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = 0.5;
    g.drawImage(getGlow('#ff2bd6', true), sx - R * 2, sy - R * 2, R * 4, R * 4);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    // mountains
    g.fillStyle = '#0a0418';
    g.strokeStyle = rgba(c1, 0.8); g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, hz);
    var mr = mulberry32(42);
    for (var x = 0; x <= w + 40; x += 40) {
      var mh = (Math.abs(x - w / 2) / (w / 2)) * h * 0.18 * (0.5 + mr());
      g.lineTo(x, hz - mh);

    g.lineTo(w, hz); g.closePath(); g.fill(); g.stroke();

    g.fillStyle = '#07030f'; g.fillRect(0, hz, w, h - hz);
    g.strokeStyle = rgba('#22f3ff', 0.75); g.lineWidth = 1.5;
    g.beginPath();

    g.stroke();
    var hg = g.createLinearGradient(0, hz - 6, 0, hz + 40);
    hg.addColorStop(0, rgba(c1, 0.6)); hg.addColorStop(1, rgba(c1, 0));

  }

  // =========================================================
  //  WORLD EXTRAS — pseudo-3D buildings, rain
  // =========================================================
  var TALL = { building: 1, datablock: 1, pillar: 1, container: 1, station: 1 };
  var roofCache = new Map();
  var BFRAME = 0;

  function decoHeight(d) {
    if (d.hgt) return d.hgt;
    var r = mulberry32(d.seed + 99);
    if (d.t === 'building') d.hgt = 60 + r() * 190;
    else if (d.t === 'datablock') d.hgt = 25 + r() * 70;
    else if (d.t === 'pillar') d.hgt = 140 + r() * 60;
    else if (d.t === 'container') d.hgt = 22 + Math.floor(r() * 3) * 18;
    else d.hgt = 40 + r() * 60;
    return d.hgt;
  }
  function footprint(d) {
    if (d.fp) return d.fp;
    var w = d.w, h = d.h, c = Math.cos(d.rot), s = Math.sin(d.rot), pts = [];
    [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]].forEach(function (p) {
      pts.push([d.x + p[0] * c - p[1] * s, d.y + p[0] * s + p[1] * c]);
    });
    d.fp = pts;
    return pts;
  }
  function roofSprite(d, th) {
    var key = d.seed + d.t, cv = roofCache.get(key);
    if (cv) return cv;
    var sc = IS_MOBILE ? 1 : 1.3;
    cv = makeCanvas(d.w * sc + 4, d.h * sc + 4);
    var g = cv.getContext('2d');
    g.scale(sc, sc); g.translate(d.w / 2 + 1.5, d.h / 2 + 1.5);
    var copy = { t: d.t, x: 0, y: 0, w: d.w, h: d.h, rot: 0, seed: d.seed, r: d.r, col: d.col };
    drawDeco(g, copy, th, true);
    roofCache.set(key, cv);
    if (roofCache.size > 120) roofCache.delete(roofCache.keys().next().value);
    return cv;
  }

  // walls and roofs drawn live so they lean away from the screen centre like real height
  function drawBuildings(g, R, cam, rad) {
    var T = R.T, th = T.theme, list = [];
    BFRAME++;
    var tx0 = Math.floor((cam.x - rad) / TILE), tx1 = Math.floor((cam.x + rad) / TILE);
    var ty0 = Math.floor((cam.y - rad) / TILE), ty1 = Math.floor((cam.y + rad) / TILE);
    for (var tx = tx0; tx <= tx1; tx++) for (var ty = ty0; ty <= ty1; ty++) {
      var bk = T.buckets.get(tileKey(tx, ty));
      if (!bk) continue;
      for (var i = 0; i < bk.decos.length; i++) {
        var d = bk.decos[i];
        if (!TALL[d.t] || d.dead || d.bf === BFRAME) continue;
        d.bf = BFRAME;
        var dd = dist2(d.x, d.y, cam.x, cam.y);
        if (dd > (rad + d.r) * (rad + d.r)) continue;
        d.cd = dd;
        list.push(d);
      }
    }
    list.sort(function (a, b) { return b.cd - a.cd; });
    var k = QUALITY ? 0.0011 : 0.0009;
    for (var n = 0; n < list.length; n++) {
      var b = list[n], H = decoHeight(b) * k;
      var ox = (b.x - cam.x) * H, oy = (b.y - cam.y) * H;
      var fp = footprint(b), col = (b.seed % 2) ? th.edgeA : th.edgeB;
      // side walls
      for (var e = 0; e < 4; e++) {
        var p0 = fp[e], p1 = fp[(e + 1) % 4];
        g.beginPath();
        g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.lineTo(p1[0] + ox, p1[1] + oy); g.lineTo(p0[0] + ox, p0[1] + oy);
        g.closePath();
        g.fillStyle = e % 2 ? '#0a0716' : '#120c26';
        g.fill();
        if (b.t === 'building' || b.t === 'station') {
          // neon window bands along the wall
          g.strokeStyle = rgba(col, 0.35); g.lineWidth = 2;
          for (var f = 0.3; f < 0.95; f += 0.3) {
            g.beginPath();
            g.moveTo(p0[0] + ox * f, p0[1] + oy * f); g.lineTo(p1[0] + ox * f, p1[1] + oy * f);
            g.stroke();
          }
        }
      }
      // vertical corner edges
      g.strokeStyle = rgba(col, 0.55); g.lineWidth = 1.6;
      g.beginPath();
      for (e = 0; e < 4; e++) { g.moveTo(fp[e][0], fp[e][1]); g.lineTo(fp[e][0] + ox, fp[e][1] + oy); }
      g.stroke();
      // roof
      var spr = roofSprite(b, th);
      g.save();
      g.translate(b.x + ox, b.y + oy); g.rotate(b.rot);
      g.drawImage(spr, -b.w / 2 - 1.5, -b.h / 2 - 1.5, b.w + 3, b.h + 3);
      g.restore();
    }
  }

  // ---------- rain ----------

  function drawRainWorld(g, R, cam, hw, hh, tm) {

  function drawRainScreen(g, R, tm) {
    var n = IS_MOBILE ? 70 : 140;

    var dt = G.dt, sp = R.player.speed / 1000;

    g.beginPath();
    for (var k = 0; k < DROPS.length; k++) {
      var d = DROPS[k];
      d.y += dt * (1.6 + sp) * d.s; d.x += dt * 0.12 * d.s;

      var x = d.x * VW, y = d.y * VH, L = 14 + d.s * 16 + sp * 20;
      g.moveTo(x, y); g.lineTo(x - L * 0.12, y - L);

    if (R.flash > 0) {

  }

  // =========================================================
  //  GAME — race setup, loop, modes, drift scoring, HUD
  // =========================================================
  var G = { state: 'menu', R: null, cam: { x: 0, y: 0, zoom: 1, z0: 1 }, shake: 0, frame: 0, now: 0, menuT: 0, autopilot: false };
  var TRACK_CACHE = {};

  // estimated reference lap (for time-trial medals)

    var t = 0, v = 0, maxV = 880;

  var DRIFT_MEDALS = [40000, 20000, 8000];

  // ---------- race creation ----------

    var T, theme;

    if (cfg.mode === 'endless') {
      var keys = ['city', 'sunset', 'desert', 'snow', 'tunnel', 'cyber'];
      var th = cfg.theme || keys[Math.floor(Math.random() * keys.length)];
      T = buildEndless(th, Math.floor(Math.random() * 1e9));
    } else T = getTrack(cfg.track);

    PARTS.length = 0;

    var R = {
      cfg: cfg, mode: cfg.mode, T: T, cars: [], player: null, time: 0, running: false, countdown: 3.6, lastCount: 4,
      done: false, doneT: 0, laps: cfg.mode === 'career' ? 3 : (cfg.mode === 'tt' ? 3 : 999),
      drift: { active: false, chain: 0, chainT: 0, mult: 1, grace: 0, total: 0, edge: false, best: 0 },
      pops: [], msg: null, ghostRec: [], ghostT: 0, ghost: null, newBest: false, bestLapRun: Infinity,
      timeLeft: cfg.mode === 'drift' ? 60 : (cfg.mode === 'endless' ? 25 : 0), cpIdx: 0, cpCount: 0,
      finishOrder: [], wallHits: 0, weather: 'clear', gripMul: 1, rec: [], recT: 0
    };

    // player car

    var pc = newCar({ stats: carStats(pid), model: CARS[carIndex(pid)].shape, color: own.color, neon: kitColor(own.neon), name: SAVE.settings.name || 'PLAYER', isPlayer: true, trail: own.trail, decal: own.decal, rim: own.rim, num: carIndex(pid) + 1, skin: own.skin });
    pc.sk = playerSkills();
    R.player = pc;
    var grid = [];
    if (cfg.mode === 'career') {
      var cup = CUPS[cfg.cup];
      var names = AI_NAMES.slice().sort(function () { return Math.random() - 0.5; });
      for (var k = 0; k < 3; k++) {
        var ai = newAI(cup.skills[k]);
        var st = cup.ai.map(function (v) { return v + (Math.random() - 0.5) * 0.6; });
        var mi = clamp(Math.floor(cfg.cup * 2 + k * 0.7 + Math.random() * 1.5), 0, CARS.length - 1);
        var cols = BODY_COLORS.filter(function (cc) { return cc !== own.color; });
        var ac = newCar({ stats: st, model: CARS[mi].shape, color: cols[(k * 3 + cfg.cup) % cols.length], neon: NEON_KITS[(k * 2 + 1 + cfg.cup) % NEON_KITS.length].col, name: names[k], ai: ai });
        grid.push(ac);

    else grid.push(pc);

        var c = grid[k], gi = idxW(T, -Math.round((70 + Math.floor(k / 2) * 75) / T.spacing)), lat = (k % 2 ? 1 : -1) * 48;
        if (grid.length === 1) lat = 0;

        c.a = Math.atan2(T.ty[gi], T.tx[gi]); c.ti = gi; c.dist = T.d[gi]; c.lap = -1; c.prog = c.dist - T.L;

  }

  // ---------- callbacks from physics ----------
  function onWall(c, v, x, y, nx, ny) {
    var R = G.R;
    var n = Math.min(14, Math.floor(v / 45));

      var a = Math.atan2(-ny, -nx) + rnd(-1.2, 1.2), s = rnd(200, 600);

    }

    }

    if (c.isPlayer) {

      c.nitro = Math.min(100, c.nitro + 6);

  function onLap(c) {
    var R = G.R;
    if (c.lap <= 0) { c.lapStart = R.time; if (c.isPlayer) R.ghostRec = []; return; }
    var lt = R.time - c.lapStart;
    c.lapStart = R.time;
    c.lapTimes.push(lt);
    if (lt < c.bestLap) c.bestLap = lt;
    if (c.lap >= R.laps && !c.finished && R.mode !== 'drift') {
      c.finished = true; c.finishTime = R.time;
      R.finishOrder.push(c);

    if (tid && R.mode !== 'drift') {
      var prevBest = SAVE.best[tid];
      if (!(prevBest <= lt)) {

        if (c.lap < R.laps || R.mode === 'tt') { setMsg(t('newBest'), '#ffe14d', 1.8); sfx('best'); }
      }

      if (!gold || lt < gold.t) saveGhost(tid, { t: lt, m: c.model, d: R.ghostRec });
      if (R.mode === 'tt' && (!R.ghost || lt < R.ghost.t)) R.ghost = { t: lt, m: c.model, d: R.ghostRec };
      lbAdd(SAVE.lb.lap, tid, { n: SAVE.settings.name, v: Math.round(lt * 1000) / 1000, c: CARS[carIndex(SAVE.car)].name, d: Date.now() }, true, 8);

  function isNear(x, y) {

  function addPop(text, col, life, big) {

    P.push({ text: text, col: col, t: 0, life: life || 1, big: big });

  // ---------- per-frame update ----------
  function updateRace(dt) {
    var R = G.R, T = R.T, p = R.player, i, c;
    if (R.online) onlineUpdate(R, dt);
    if (R.countdown > 0) {
      if (!R.online) R.countdown -= dt;
      var cnum = Math.ceil(R.countdown - 0.6);
      if (cnum < R.lastCount && cnum >= 1 && cnum <= 3) { R.lastCount = cnum; sfx('count'); }
      if (R.countdown <= 0.6 && !R.running) {
        R.running = true; sfx('go'); buzz(60); setMsg(t('go'), '#00ff9c', 0.9);

        for (i = 0; i < R.cars.length; i++) R.cars[i].lapStart = 0;
      }
    }
    if (R.running && !R.done) R.time += dt;

    // inputs
    if (p.finished || R.done || G.autopilot) {
      if (!p.ai) p.ai = newAI(G.autopilot ? G.autopilotSkill : 0.7);
      aiControl(p, R, dt);
      if (G.autopilotDrift && T.closed && !R.done) {

        if (mode === 1) driftController(p, R);
        p.in.thr = 1; p.in.brk = 0;

  function syncClock() {
    var n = 0;
    var go = function () { if (n++ < 6) { netSend({ t: 'ping', c: Date.now() }); setTimeout(go, 250); } };
    go();
  }

  // ---------- incoming messages ----------
  function netHandle(m) {
    var pr = netProfile(), i;
    switch (m.t) {
      case 'welcome':
        NET.status = 'on'; NET.retry = 0; NET.id = m.id; NET.firstTry = 0; NET.fails = 0;
        NET.offset = m.s - Date.now();
        if (pr) { pr.id = m.id; pr.name = m.name; save(); }
        syncClock();
        netSend({ t: 'friends', ids: pr.friends.map(function (f) { return f.id; }) });
        if (NET.pendingJoin) { netSend({ t: 'join', code: NET.pendingJoin }); NET.pendingJoin = null; }
        if (DBOARD.pending) { netSend(DBOARD.pending); DBOARD.pending = null; }
        if (DBOARD.wantList) { netSend({ t: 'dget', day: todayKey() }); DBOARD.wantList = false; }
        if (NET.wantQuick) { NET.wantQuick = false; netSend({ t: 'car', car: myCarInfo() }); netSend({ t: 'quick' }); }
        break;
      case 'pong': {
        var rtt = Date.now() - m.c;
        if (rtt <= NET.rtt + 15) { NET.rtt = rtt; NET.offset = m.s + rtt / 2 - Date.now(); }
        return;
      }
      case 'presList':
        NET.friendsOn = {};
        m.list.forEach(function (f) { NET.friendsOn[f.id] = f; updateFriendName(f.id, f.name); });
        break;
      case 'pres':
        NET.friendsOn[m.id] = m; updateFriendName(m.id, m.name);
        break;
      case 'freq':
        if (isFriend(m.from)) { netSend({ t: 'facc', to: m.from }); break; }
        for (i = 0; i < NET.reqs.length; i++) if (NET.reqs[i].from === m.from) return;
        NET.reqs.push(m); sfx('cp');
        netNote(t('netReqFrom', { n: m.name }), [[t('accept'), function () { acceptReq(m.from); }], [t('decline'), function () { dropReq(m.from); }]]);
        break;
      case 'facc':
        addFriend(m.from, m.name);
        showToast(t('netNowFriends', { n: m.name }), 2500);
        break;
      case 'inv':
        NET.invites = NET.invites.filter(function (x) { return x.from !== m.from; });
        NET.invites.push(m); sfx('cp');
        netNote(t('netInvFrom', { n: m.name, s: m.size }), [[t('join'), function () { joinInvite(m); }], [t('decline'), function () { dropInvite(m.from); }]], 15000);
        break;
      case 'ok':
        if (m.what === 'freq') showToast(m.online ? t('netReqSent') : t('netReqQueued'), 2200);
        if (m.what === 'inv') showToast(t('netInvSent'), 1800);
        break;
      case 'err':
        showToast(t('netErr_' + m.e), 2600);
        if (m.e === 'badSecret') netDisconnect();
        break;
      case 'room':
        NET.room = m;
        if (UI.screen === 'online' || UI.screen === 'menu') { if (!G.R || !G.R.online) showScreen('lobby'); }
        else if (UI.screen === 'lobby') renderLobby();
        else if (UI.screen === 'results' && G.R && G.R.online) { /* stay on results */ }
        break;
      case 'left': NET.room = null; if (UI.screen === 'lobby') showScreen('online'); break;
      case 'kicked': NET.room = null; showToast(t('netKicked'), 2500); if (UI.screen === 'lobby') showScreen('online'); break;
      case 'start': onNetStart(m); break;
      case 'emo': onNetEmote(m); return;
      case 'dlist': if (m.day === todayKey()) { DBOARD.list = m.list; renderDailyBoard(); } return;
      case 'snap': onNetSnap(m); return;
      case 'owner': onNetOwner(m); return;
      case 'finx': onNetFinx(m); return;
      case 'res': onNetResults(m); break;
    }
    netUI();
  }

  // ---------- friends ----------
  function isFriend(id) { var pr = netProfile(); return !!(pr && pr.friends.some(function (f) { return f.id === id; })); }
  function addFriend(id, name) {
    var pr = netProfile();
    if (!pr || id === NET.id) return;
    if (!isFriend(id)) pr.friends.push({ id: id, name: name || id });
    else updateFriendName(id, name);
    save();
    netSend({ t: 'friends', ids: pr.friends.map(function (f) { return f.id; }) });
  }
  function updateFriendName(id, name) {
    var pr = netProfile();
    if (!pr || !name) return;
    pr.friends.forEach(function (f) { if (f.id === id && f.name !== name) { f.name = name; save(); } });
  }
  function removeFriend(id) {
    var pr = netProfile();
    pr.friends = pr.friends.filter(function (f) { return f.id !== id; });
    save();
    netSend({ t: 'friends', ids: pr.friends.map(function (f) { return f.id; }) });
  }
  function sendFriendReq(code) {
    var id = cleanCode(code);
    if (id.length !== 8) { showToast(t('netErr_badCode'), 2200); return; }
    if (id === NET.id) { showToast(t('netErr_self'), 2200); return; }
    addFriend(id, id);
    netSend({ t: 'freq', to: id });
  }
  function acceptReq(id) {
    var r = NET.reqs.filter(function (x) { return x.from === id; })[0];
    addFriend(id, r ? r.name : id);
    netSend({ t: 'facc', to: id });
    dropReq(id);
  }
  function dropReq(id) { NET.reqs = NET.reqs.filter(function (x) { return x.from !== id; }); $('netNote').classList.add('hidden'); netUI(); }
  function dropInvite(id) { NET.invites = NET.invites.filter(function (x) { return x.from !== id; }); $('netNote').classList.add('hidden'); netUI(); }
  function joinInvite(inv) { dropInvite(inv.from); netJoin(inv.code); }
  function netJoin(code) {
    code = cleanCode(code).slice(0, 5);
    if (code.length < 4) { showToast(t('netErr_noSuchRoom'), 2000); return; }
    if (NET.status !== 'on') { NET.pendingJoin = code; netConnect(); showScreen('online'); return; }
    netSend({ t: 'join', code: code });
  }

  // ---------- race: setup ----------
  function onNetStart(m) {
    if (G.R && G.R.online && G.R.online.raceId === m.r) {
      if (m.owner) applyOwner(G.R, m.owner);
      return;                                    // reconnect during the same race: keep going
    }
    NET.lastRes = null;
    startRace({ mode: 'online', track: m.track, net: m, weather: m.weather || 'clear' });
  }

  // called from startRace() — builds the grid in slot order
  function onlineGrid(R, m, pc) {
    var grid = [], skill = [0.45, 0.72, 0.9][m.diff];
    R.online = { raceId: m.r, startAt: m.startAt, owner: m.owner === myNetId(), ownerId: m.owner, local: !!m.local, size: m.size, sendT: 0, mySlot: -1, finSent: false, teams: [0, 0], mode: m.mode === 'drift' ? 'drift' : 'race' };
    R.laps = R.online.mode === 'drift' ? 999 : m.laps;
    if (R.online.mode === 'drift') R.timeLeft = m.dur || 90;
    m.grid.forEach(function (e) {
      var c;
      if (e.id && e.id === myNetId()) {
        c = pc; c.team = e.team; c.neon = TEAM_COL[e.team]; c.name = e.name;
        R.online.mySlot = e.slot;
      } else {
        c = newCar({ stats: e.car.s, model: e.car.m, color: e.car.c, neon: TEAM_COL[e.team], name: e.name, trail: e.car.t, decal: e.car.d, rim: e.car.w, num: e.slot + 1, skin: e.car.k });
        c.team = e.team; c.isBot = !!e.bot; c.netId = e.id; c.botSkill = skill;
        if (e.bot && R.online.owner) { c.ai = newAI(skill); c.ai.driftMode = R.online.mode === 'drift'; }
        else { c.remote = true; c.buf = []; }
      }
      c.slot = e.slot;
      grid.push(c);
    });
    return grid;
  }
  function onlineResume(R, m) {
    if (!m.resume || !m.you) return;
    var p = R.player, d = m.you;
    p.x = d[0]; p.y = d[1]; p.a = d[2]; p.vx = d[3]; p.vy = d[4]; p.lap = d[7]; p.ti = -1;
    locate(R.T, p.x, p.y, -1, LOC); p.ti = LOC.i; p.dist = LOC.d; p.prog = d[8];
  }

  // ---------- race: per-frame ----------
  function stateOf(c) {
    var fl = (c.drifting && Math.abs(c.slip) > 0.18 ? 1 : 0) | (c.nitroOn ? 2 : 0) | (c.brakeLight ? 4 : 0) | (c.finished ? 8 : 0) | (c.boostT > 0.5 ? 16 : 0);
    return [Math.round(c.x * 10) / 10, Math.round(c.y * 10) / 10, Math.round(c.a * 1000) / 1000, Math.round(c.vx), Math.round(c.vy),
      Math.round(c.w * 100) / 100, fl, c.lap, Math.round(c.prog), Math.round(c.isPlayer && G.R ? G.R.drift.total + G.R.drift.chain : (c.dscore || 0))];
  }
  function onlineUpdate(R, dt) {
    var O = R.online, i, c;
    if (!R.running) R.countdown = Math.max(0, (O.startAt - netNow()) / 1000 + 0.6);
    // remote cars follow interpolated snapshots
    // interpolation delay adapts to how late snapshots actually arrive
    var rt = netNow() - clamp((O.lateMax || 60) + 35, 80, 450);
    for (i = 0; i < R.cars.length; i++) {
      c = R.cars[i];
      if (c.remote) interpRemote(c, rt);
    }
    // send our state (and our bots) ~20 times a second
    O.sendT += dt;
    if (O.sendT >= 0.05 && !O.local) {
      O.sendT = 0;
      netSend({ t: 'st', r: O.raceId, d: stateOf(R.player) });
      if (O.owner) {
        var b = [];
        for (i = 0; i < R.cars.length; i++) { c = R.cars[i]; if (c.isBot && !c.remote) b.push([c.slot, stateOf(c)]); }
        if (b.length) netSend({ t: 'bst', r: O.raceId, b: b });
      }
    }
    // live team points
    O.teams = [0, 0];
    if (O.mode === 'drift') {
      if (R.running && !R.done) R.timeLeft = Math.max(0, R.timeLeft - dt);
      for (i = 0; i < R.cars.length; i++) { c = R.cars[i]; O.teams[c.team] += carScore(R, c); }
      return;
    }
    var order = R.cars.slice().sort(function (a, b) { return placeKey(b) - placeKey(a); });
    for (i = 0; i < order.length; i++) O.teams[order[i].team] += [15, 12, 10, 8, 6, 5, 4, 3, 2, 1][i] || 0;
  }
  function carScore(R, c) {
    if (c.isPlayer) return Math.round(R.drift.total + R.drift.chain);
    if (c.remote) return c.netScore || 0;
    return Math.round(c.dscore || 0);
  }
  // simple drift scoring for bots we simulate (drift battle)
  function botDriftScore(c, dt) {
    if (!c.D) c.D = { t: 0, chain: 0, grace: 0 };
    var D = c.D;
    if (c.drifting && c.speed > 240 && Math.abs(c.slip) > 0.22 && c.vF > 0) {
      D.t += dt; D.grace = 1.1;
      var m = Math.min(9, 1 + Math.floor(D.t / 1.2));
      D.chain += (20 + Math.min(Math.abs(c.slip), 1.1) * 130) * clamp(c.speed / 500, 0.5, 1.8) * 10 * dt * m;
    } else if (D.grace > 0) {
      D.grace -= dt;
      if (D.grace <= 0) { c.dscore = (c.dscore || 0) + D.chain; D.chain = 0; D.t = 0; }
    }
  }
  function onNetEmote(m) {
    var R = G.R;
    sfx(m.i === 6 ? 'horn' : 'emote');
    if (R && R.online) {
      for (var i = 0; i < R.cars.length; i++) {
        var c = R.cars[i];
        if ((c.isPlayer && m.id === NET.id) || (c.netId && c.netId === m.id)) c.emo = { i: m.i, t: 3 };
      }
    }
    NET.emos = NET.emos || {};
    NET.emos[m.id] = { i: m.i, until: Date.now() + 3500 };
    if (UI.screen === 'lobby') { renderLobby(); setTimeout(function () { if (UI.screen === 'lobby') renderLobby(); }, 3600); }
  }
  function placeKey(c) { return c.finished ? 1e9 - (c.finishTime || 0) * 1000 : c.prog; }

  function interpRemote(c, rt) {
    var B = c.buf, n = B.length;
    if (!n) { c.speed = 0; return; }
    var d, k;
    if (rt <= B[0].ts) d = B[0].d;
    else if (rt >= B[n - 1].ts) {
      // short extrapolation (dead reckoning)
      d = B[n - 1].d;
      var ex = Math.min(0.25, (rt - B[n - 1].ts) / 1000);
      c.x = d[0] + d[3] * ex; c.y = d[1] + d[4] * ex; c.a = d[2] + d[5] * ex;
      setRemoteFlags(c, d);
      return;
    } else {
      for (k = n - 2; k >= 0; k--) if (B[k].ts <= rt) break;
      var A = B[k], Bb = B[k + 1], f = (rt - A.ts) / Math.max(1, Bb.ts - A.ts);
      c.x = lerp(A.d[0], Bb.d[0], f); c.y = lerp(A.d[1], Bb.d[1], f);
      c.a = A.d[2] + wrapAngle(Bb.d[2] - A.d[2]) * f;
      c.vx = lerp(A.d[3], Bb.d[3], f); c.vy = lerp(A.d[4], Bb.d[4], f);
      setRemoteFlags(c, f < 0.5 ? A.d : Bb.d);
      return;
    }
    c.x = d[0]; c.y = d[1]; c.a = d[2];
    setRemoteFlags(c, d);
  }
  function setRemoteFlags(c, d) {
    c.vx = d[3]; c.vy = d[4]; c.w = d[5];
    var fl = d[6];
    c.drifting = !!(fl & 1); c.nitroOn = !!(fl & 2); c.brakeLight = fl & 4 ? 1 : 0;
    if (fl & 8) c.finished = true;
    c.boostT = fl & 16 ? 0.8 : 0;
    c.lap = d[7]; c.prog = d[8];
    if (d.length > 9) c.netScore = d[9];
    c.speed = Math.sqrt(c.vx * c.vx + c.vy * c.vy); c.vF = c.speed;
    c.slip = c.drifting ? 0.4 : 0;
  }
  function onNetSnap(m) {
    var R = G.R;
    if (!R || !R.online || m.r !== R.online.raceId) return;
    for (var i = 0; i < m.c.length; i++) {
      var e = m.c[i], c = carBySlot(R, e[0]);
      if (!c || !c.remote) continue;
      var ts = m.s - e[1];
      var late = netNow() - ts, O = R.online;
      O.lateMax = Math.max(late, (O.lateMax || late) - 0.4);
      var B = c.buf;
      if (B.length && ts <= B[B.length - 1].ts) continue;
      B.push({ ts: ts, d: e[2] });
      if (B.length > 24) B.shift();
    }
  }
  function carBySlot(R, slot) { for (var i = 0; i < R.cars.length; i++) if (R.cars[i].slot === slot) return R.cars[i]; return null; }

  function onNetOwner(m) { if (G.R && G.R.online && m.r === G.R.online.raceId) applyOwner(G.R, m.id); }
  function applyOwner(R, id) {
    var O = R.online, mine = id === NET.id;
    O.ownerId = id;
    if (mine === O.owner) return;
    O.owner = mine;
    R.cars.forEach(function (c) {
      if (!c.isBot) return;
      if (mine) {
        // take over the bots from where we last saw them
        c.remote = false; c.ai = newAI(c.botSkill);
        locate(R.T, c.x, c.y, -1, LOC); c.ti = LOC.i; c.dist = LOC.d;
      } else { c.remote = true; c.buf = []; c.ai = null; }
    });
  }
  function onNetFinx(m) {
    var R = G.R;
    if (!R || !R.online || m.r !== R.online.raceId) return;
    var c = carBySlot(R, m.slot);
    if (c && c.remote) { c.finished = true; c.finishTime = m.time; }
  }
  // called from onLap when a car we simulate crosses the finish line for the last time
  function onlineFinish(R, c) {
    if (R.online.local) return;
    if (c.isPlayer) netSend({ t: 'fin', r: R.online.raceId, time: c.finishTime, best: isFinite(c.bestLap) ? c.bestLap : 999 });
    else if (c.isBot && !c.remote) netSend({ t: 'fin', r: R.online.raceId, slot: c.slot, time: c.finishTime, best: isFinite(c.bestLap) ? c.bestLap : 999 });
  }
  function onNetResults(m) {
    NET.lastRes = m;
    var R = G.R;
    if (R && R.online && m.r === R.online.raceId) {
      R.netRes = m;
      if (!R.done) {
        R.player.finished = true;
        setMsg(m.win === R.player.team ? t('teamWin') : t('teamLose'), TEAM_COL[m.win], 2.4);
        sfx('finish', m.win === R.player.team);
        endRace();
      }
    }
  }
  function netQuick() {
    if (NET.status !== 'on') { NET.wantQuick = true; netConnect(); return; }
    netSend({ t: 'car', car: myCarInfo() });
    netSend({ t: 'quick' });
  }
  function onlineLeave() {
    netSend({ t: 'leave' });
    NET.room = null;
  }

  // =========================================================
  //  VS BOTS — local team races (no server needed)
  // =========================================================
  function botsCfg() {
    if (!SAVE.botsCfg) SAVE.botsCfg = { game: 'race', size: 2, track: 0, laps: 3, weather: 'clear', diff: 1 };
    if (!trackUnlocked(SAVE.botsCfg.track)) SAVE.botsCfg.track = 0;
    return SAVE.botsCfg;
  }
  function localBotsMsg(cfg) {
    var me = myNetId(), st = carStats(SAVE.car);
    var entries = [{ id: me, name: SAVE.settings.name || 'PLAYER', team: 0, bot: 0, car: myCarInfo() }];
    var names = AI_NAMES.slice().sort(function () { return Math.random() - 0.5; });
    var cols = BODY_COLORS.slice(0, 8);
    var push = function (team) {
      entries.push({
        id: null, name: names.pop(), team: team, bot: 1,
        car: { m: Math.floor(Math.random() * 8), c: pick(cols), n: 'BOT', t: 'neon', d: 'none', w: 'dark',
          s: st.map(function (v) { return clamp(v + (cfg.diff - 1) * 0.6 + (Math.random() - 0.5) * 0.6, 2, 13); }) }
      });
    };
    for (var k = 0; k < cfg.size - 1; k++) push(0);
    for (k = 0; k < cfg.size; k++) push(1);
    entries.sort(function () { return Math.random() - 0.5; });
    return {
      r: 1, local: true, startAt: netNow() + 4200, owner: me, laps: cfg.laps, diff: cfg.diff, size: cfg.size,
      mode: cfg.game === 'drift' ? 'drift' : 'race', dur: 90, weather: cfg.weather,
      grid: entries.map(function (e, i) { return { slot: i, id: e.id, name: e.name, team: e.team, bot: e.bot, car: e.car }; })
    };
  }
  function localTeamCheck(R, dt) {
    if (R.netRes) return;
    var O = R.online;
    if (O.mode === 'drift') { if (R.running && R.timeLeft <= 0) finishLocal(R); return; }
    if (R.player.finished) {
      R.lwait = (R.lwait || 0) + dt;
      var all = true;
      for (var i = 0; i < R.cars.length; i++) if (!R.cars[i].finished) all = false;
      if (all || R.lwait > 10) finishLocal(R);
    }
  }
  function finishLocal(R) {
    var O = R.online, pts = [15, 12, 10, 8, 6, 5, 4, 3, 2, 1];
    var rows = R.cars.map(function (c) {
      return {
        slot: c.slot, name: c.name, team: c.team, bot: c.isBot ? 1 : 0, id: c.isPlayer ? myNetId() : null,
        fin: c.finished ? 1 : 0, time: c.finishTime || 0, best: isFinite(c.bestLap) ? c.bestLap : 999, prog: c.prog, score: carScore(R, c), left: 0
      };
    });
    var teams = [0, 0], win;
    if (O.mode === 'drift') {
      rows.sort(function (a, b) { return b.score - a.score; });
      rows.forEach(function (r) { r.pts = r.score; teams[r.team] += r.score; });
    } else {
      rows.sort(function (a, b) {
        if (a.fin && b.fin) return a.time - b.time;
        if (a.fin) return -1;
        if (b.fin) return 1;
        return b.prog - a.prog;
      });
      rows.forEach(function (r, i) { r.pts = pts[i] || 0; teams[r.team] += r.pts; });
    }
    win = teams[0] > teams[1] ? 0 : (teams[1] > teams[0] ? 1 : rows[0].team);
    onNetResults({ r: O.raceId, rows: rows, teams: teams, win: win, mode: O.mode });
  }

  // ---------- setup screen ----------
  function renderBots() {
    var C = botsCfg(), S = $('btSet');
    S.innerHTML = '';
    var row = function (label, vals, cur, key, fmt) {
      var r = el('div', { cls: 'lrow' }, '<span>' + esc(label) + '</span>');
      var tb = el('div', { cls: 'tabs' });
      vals.forEach(function (v) {
        var b = el('button', { cls: 'tab' + (cur === v ? ' sel' : '') }, esc(fmt(v)));
        b.addEventListener('click', function () { sfx('click'); C[key] = v; save(); renderBots(); });
        tb.appendChild(b);
      });
      r.appendChild(tb); S.appendChild(r);
    };
    row(t('gameMode'), ['race', 'drift'], C.game, 'game', function (v) { return v === 'drift' ? t('driftBattle') : t('race'); });
    row(t('mode'), [1, 2, 3, 4, 5], C.size, 'size', function (v) { return v + 'v' + v; });
    if (C.game === 'drift') S.appendChild(el('div', { cls: 'help' }, esc(t('driftBattleHelp'))));
    else row(t('lapsL'), [1, 2, 3, 5], C.laps, 'laps', function (v) { return String(v); });
    row(t('weather'), ['clear', 'rain'], C.weather, 'weather', function (v) { return t('w_' + v); });
    row(t('bots'), [0, 1, 2], C.diff, 'diff', function (v) { return t('diff' + v); });
    // tracks
    var tl = $('btTracks');
    tl.innerHTML = '';
    TRACKS.forEach(function (d, i) {
      var ok = trackUnlocked(i);
      var card = el('div', { cls: 'card trk' + (ok ? '' : ' locked') + (C.track === i ? ' sel' : '') });
      var th = trackThumb(i), cv = makeCanvas(th.width, th.height);
      cv.getContext('2d').drawImage(th, 0, 0);
      card.appendChild(cv);
      card.appendChild(el('b', null, (ok ? '' : '🔒 ') + esc(trackName(i))));
      card.addEventListener('click', function () { sfx('click'); C.track = i; save(); renderBots(); });
      tl.appendChild(card);
    });
    $('btInfo').textContent = t('botsInfo', { n: C.size - 1, b: C.size * 2 - 1, s: C.size });
  }
  function startBots() {
    var C = botsCfg();
    sfx('click');

    var w = 320, h = 200, cv = makeCanvas(w, h), g = cv.getContext('2d');
    var minX = Math.min.apply(null, T.px), maxX = Math.max.apply(null, T.px), minY = Math.min.apply(null, T.py), maxY = Math.max.apply(null, T.py);
    var s = Math.min((w - 40) / (maxX - minX), (h - 40) / (maxY - minY));
    var ox = (w - (maxX - minX) * s) / 2 - minX * s, oy = (h - (maxY - minY) * s) / 2 - minY * s;
    var bg = g.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, th.ground); bg.addColorStop(1, '#05020c');

    for (var x = 0; x < w; x += 20) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (var y = 0; y < h; y += 20) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    g.beginPath();
    for (var i = 0; i <= T.n; i += 4) { var j = i % T.n; if (i) g.lineTo(T.px[j] * s + ox, T.py[j] * s + oy); else g.moveTo(T.px[j] * s + ox, T.py[j] * s + oy); }
    g.closePath(); g.lineJoin = 'round';
    g.strokeStyle = rgba(th.edgeA, 0.25); g.lineWidth = 14; g.stroke();
    g.strokeStyle = th.edgeA; g.lineWidth = 5; g.stroke();
    g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke();
    g.fillStyle = '#ffe14d'; g.beginPath(); g.arc(T.px[0] * s + ox, T.py[0] * s + oy, 5, 0, TAU); g.fill();

  function drawGarage(dt) {
    var cv = $('garageCv');
    if (!cv || UI.screen !== 'garage') return;
    var w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    var d = Math.min(window.devicePixelRatio || 1, 2);
    if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }
    var g = cv.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);
    var car = CARS[UI.garageIdx], own = SAVE.cars[car.id];
    var color = own ? own.color : car.color, neon = own ? kitColor(own.neon) : '#22f3ff';
    var bg = g.createRadialGradient(w / 2, h * 0.55, 10, w / 2, h * 0.55, Math.max(w, h) * 0.7);
    bg.addColorStop(0, '#1d0b3a'); bg.addColorStop(1, '#05020c');
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    // floor grid in perspective
    g.strokeStyle = rgba(neon, 0.25); g.lineWidth = 1;
    var hz = h * 0.3;
    for (var i = -10; i <= 10; i++) { g.beginPath(); g.moveTo(w / 2 + i * 10, hz); g.lineTo(w / 2 + i * w * 0.12, h); g.stroke(); }
    var tt = (G.now / 1000 * 0.4) % 1;
    for (i = 0; i < 9; i++) { var f = (i + tt) / 9, yy = hz + (h - hz) * f * f; g.beginPath(); g.moveTo(0, yy); g.lineTo(w, yy); g.stroke(); }
    GAR.rot += dt * 0.6;
    var sc = Math.min(w, h) / 64 * 0.9, cx = w / 2, cy = h * 0.58;
    // platform
    g.save(); g.translate(cx, cy); g.scale(1, 0.42);
    g.globalCompositeOperation = 'lighter';
    g.drawImage(getGlow(neon, true), -sc * 40, -sc * 40, sc * 80, sc * 80);
    g.strokeStyle = neon; g.lineWidth = 3; g.beginPath(); g.arc(0, 0, sc * 30, 0, TAU); g.stroke();
    g.globalCompositeOperation = 'source-over';
    g.restore();
    // trail preview circling the platform
    if (own) {
      var tnow = G.now / 1000, pts = [];
      for (var q = 0; q < 26; q++) { var ang = tnow * 2.4 - q * 0.09; pts.push({ x: cx + Math.cos(ang) * sc * 34, y: cy + Math.sin(ang) * sc * 34 * 0.42, t: tnow - q * 0.024, br: false }); }
      g.globalCompositeOperation = 'lighter';
      drawTrail(g, pts, neon, tnow, 6, own.trail || 'neon');
      g.globalCompositeOperation = 'source-over';
    }
    g.save(); g.translate(cx, cy); g.scale(1, 0.62); g.rotate(GAR.rot);
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.7;
    g.drawImage(getGlow(neon, true), -sc * 30, -sc * 20, sc * 60, sc * 40);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    g.drawImage(getCarSprite(car.shape, color, neon, own ? own.decal : 'none', own ? own.rim : 'dark', UI.garageIdx + 1, own ? own.skin : 'none'), -sc * 32, -sc * 20, sc * 64, sc * 40);
    g.restore();
    if (!own) {
      g.fillStyle = 'rgba(5,2,12,0.35)'; g.fillRect(0, 0, w, h);

    }
  }

      order = order.concat(rest);
      var place = order.indexOf(p) + 1;
      var stars = place <= 3 ? 4 - place : 0;
      var cupWasUnlocked = [];
      for (var c2 = 0; c2 < CUPS.length; c2++) cupWasUnlocked.push(cupUnlocked(c2));
      var tracksBefore = TRACKS.map(function (d, i) { return trackUnlocked(i); });
      var key = raceKey(R.cfg.cup, R.cfg.race);
      if (stars > (SAVE.career[key] || 0)) SAVE.career[key] = stars;
      if (place === 1) SAVE.stats.wins++;
      coins = Math.round(PRIZE[place - 1] * cup.reward + R.drift.total / 40);
      for (c2 = 0; c2 < CUPS.length; c2++) if (!cupWasUnlocked[c2] && cupUnlocked(c2)) unlockMsg += '<div class="unlock">★ ' + esc(t('unlockedCup')) + ' ' + esc(CUPS[c2].name[LANG]) + '</div>';

  function dailyChallenges() {
    var k = todayKey();
    if (SAVE.daily && SAVE.daily.key === k) return SAVE.daily.list;
    var r = mulberry32(k * 17 + 3), pool = CH_POOL.slice(), list = [];
    while (list.length < 3 && pool.length) {
      var c = pool.splice(Math.floor(r() * pool.length), 1)[0];
      list.push({ type: c.type, target: c.gen(r()), prog: 0, done: false, reward: c.reward, max: !!c.max });
    }
    SAVE.daily = { key: k, list: list };
    save();
    return list;
  }

  function progEvent(type, v) {
    var list = dailyChallenges(), changed = false;
    list.forEach(function (c) {
      if (c.done || c.type !== type) return;
      if (c.max) c.prog = Math.max(c.prog, v); else c.prog += v;
      changed = true;
      if (c.prog >= c.target) {
        c.done = true; c.prog = c.target;
        SAVE.coins += c.reward;
        showToast('✔ ' + t('chDone') + ' — ' + chText(c) + '  +' + c.reward + ' ◈', 3200);
        sfx('badge');
        unlockAch('daily1');
      }
    });
    if (changed) save();
  }
  function chText(c) { return t('ch_' + c.type, { n: c.type === 'driftTotal' || c.type === 'driftChal' || c.type === 'combo' ? fmtNum(c.target) : c.target }); }

  function unlockAch(id) {
    if (SAVE.ach[id]) return;
    var a = null;
    for (var i = 0; i < ACH.length; i++) if (ACH[i].id === id) a = ACH[i];
    if (!a) return;
    SAVE.ach[id] = Date.now();
    SAVE.coins += a.reward;
    save();
    setTimeout(function () { showToast(a.ic + ' ' + t('achUnlocked') + ': ' + t('ach_' + id) + '  +' + a.reward + ' ◈', 3400); sfx('badge'); }, 600);
  }
  function cupDone(ci) { for (var r = 0; r < CUPS[ci].races.length; r++) if (!raceStars(ci, r)) return false; return true; }
  function checkAchievements() {
    var owned = Object.keys(SAVE.cars).length;
    if (owned >= 3) unlockAch('cars3');
    if (owned >= CARS.length) unlockAch('cars8');
    for (var id in SAVE.cars) { var u = SAVE.cars[id].upg; if (u[0] >= 5 && u[1] >= 5 && u[2] >= 5 && u[3] >= 5) unlockAch('maxed'); }
    if (cupDone(0)) unlockAch('cup1');
    if (cupDone(2)) unlockAch('cup3');
    if (cupDone(4)) unlockAch('cup5');
    if (SAVE.stats.driftTotal >= 100000) unlockAch('drift100k');
  }

  // called from game code
  function onDriftMult(m) {
    progEvent('mult', m);
    if (m >= SAVE.stats.maxMult) SAVE.stats.maxMult = m;
    if (m >= 9) unlockAch('mult9');
  }
  function onDriftBank(v) {
    SAVE.stats.driftTotal += v;
    if (v > SAVE.stats.bestCombo) SAVE.stats.bestCombo = v;
    progEvent('driftTotal', v);
    progEvent('combo', v);
    if (v >= 10000) unlockAch('combo10k');
  }
  function onRaceDone(R) {
    var p = R.player;
    unlockAch('first_race');
    if (R.mode === 'career') {
      var order = R.finishOrder.indexOf(p) + 1;
      if (order === 1) { unlockAch('first_win'); progEvent('win', 1); if (R.weather === 'rain') unlockAch('rainWin'); }
      if (order >= 1 && order <= 3) progEvent('podium', 1);
    } else if (R.mode === 'tt') {
      progEvent('ttLaps', p.lapTimes.length);
      if (medalFor(p.bestLap, ttMedals(R.T), true) === 3) unlockAch('gold_tt');
      if (R.cfg.track === 'daily') unlockAch('dailyTrack');
    } else if (R.mode === 'drift') {
      progEvent('driftChal', R.drift.total);
      if (medalFor(R.drift.total, DRIFT_MEDALS, false) === 3) unlockAch('gold_drift');
    } else if (R.mode === 'endless') {

  function bindTouchControls() {
    var root = document.getElementById('touch');
    // steering pad: finger position decides left / right, sliding works
    var pad = document.getElementById('steerPad');
    var padPointers = {};
    var lastPtr = null;
    function padUpdate() {
      var l = false, r = false, rect = pad.getBoundingClientRect(), cx = rect.left + rect.width / 2, any = false;
      for (var id in padPointers) { any = true; if (padPointers[id] < cx) l = true; else r = true; }
      TOUCH.padOn = any;
      if (SAVE.settings.touchSteer === 'buttons') {
        TOUCH.steerA = l && !r ? -1 : (r && !l ? 1 : 0);
      } else if (any) {
        // analog: the further from the centre of the pad, the harder you steer
        var x = padPointers[lastPtr] !== undefined ? padPointers[lastPtr] : padPointers[Object.keys(padPointers)[0]];
        var v = (x - cx) / (rect.width * 0.36);
        if (Math.abs(v) < 0.08) v = 0;
        TOUCH.steerA = clamp(v, -1, 1);
      } else TOUCH.steerA = 0;
      TOUCH.steerL = TOUCH.steerA < -0.05; TOUCH.steerR = TOUCH.steerA > 0.05;
      var lb = document.getElementById('tbL'), rb = document.getElementById('tbR');
      lb.classList.toggle('on', TOUCH.steerL); rb.classList.toggle('on', TOUCH.steerR);
      lb.style.setProperty('--amt', Math.max(0, -TOUCH.steerA).toFixed(2));
      rb.style.setProperty('--amt', Math.max(0, TOUCH.steerA).toFixed(2));
    }
    pad.addEventListener('pointerdown', function (e) { e.preventDefault(); usingTouch = true; audioInit(); padPointers[e.pointerId] = e.clientX; lastPtr = e.pointerId; try { pad.setPointerCapture(e.pointerId); } catch (er) { } padUpdate(); });
    pad.addEventListener('pointermove', function (e) { if (padPointers[e.pointerId] !== undefined) { padPointers[e.pointerId] = e.clientX; padUpdate(); } });
    var up = function (e) { delete padPointers[e.pointerId]; padUpdate(); };
    pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up); pad.addEventListener('lostpointercapture', up);

    var btns = root.querySelectorAll('[data-k]');
    Array.prototype.forEach.call(btns, function (b) {
      var k = b.getAttribute('data-k'), ids = {};
      var set = function () { TOUCH[k] = Object.keys(ids).length > 0; b.classList.toggle('on', TOUCH[k]); };
      b.addEventListener('pointerdown', function (e) { e.preventDefault(); usingTouch = true; audioInit(); ids[e.pointerId] = 1; try { b.setPointerCapture(e.pointerId); } catch (er) { } set(); });

    });

  }
